# Environment configuration
env:
  name: PointGoal
  params:
    plane_size: 10
    max_steps: 100
    max_speed: 0.2
    goal_threshold: 0.1
    goal_pos: null
    start_pos: null
    random_start: true
    random_goal: true

# Algorithm configuration
algo:
  name: random
  params: {}

# Training configuration
training:
  total_steps: 10000
  batch_size: 32
  buffer_capacity: 50000
  buffer_sequence_length: null  # Transition mode
  start_training_after: 1000
  updates_per_step: 1
  seed: 0

# Evaluation configuration
evaluation:
  eval_every_episodes: 10
  num_episodes: 1
  record_video: true
  video_every_calls: 1

# Checkpointing configuration
checkpoint:
  checkpoint_every_steps: 5000

# Logging configuration
logging:
  wandb_project: jared-rl
  wandb_entity: murphey-lab-nu
