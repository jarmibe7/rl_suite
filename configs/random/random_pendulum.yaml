# Environment configuration
env:
  name: Pendulum
  params: {}

# Algorithm configuration
algo:
  name: random
  params: {}

# Training configuration
training:
  total_steps: 10000
  batch_size: 32
  buffer_capacity: 50000
  buffer_sequence_length: null
  start_training_after: 1000
  updates_per_step: 1
  seed: 0

# Evaluation configuration
evaluation:
  eval_every_steps: 1000
  num_episodes: 1
  record_video: true
  video_every_calls: 1

# Checkpointing configuration
checkpoint:
  checkpoint_every_steps: 5000

# Logging configuration
logging:
  wandb_project: jared-rl
  wandb_entity: murphey-lab-nu