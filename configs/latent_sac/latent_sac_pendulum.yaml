env:
  name: Pendulum
  params: {}
  pixel_obs: true
  pixel_obs_size: 64

algo:
  name: latent_sac
  params:
    sac_params:
      hidden_dim: 64
      hidden_layers: 2
      learning_rate: 0.003
      gamma: 0.99
      tau: 0.005
      alpha: 0.2
      automatic_entropy_tuning: true
    latent_state_size: 4
    latent_action_size: 1
    in_channels: 3
    conv_params:
      in_image_shape: [3, 64, 64]
      out_image_shape: [3, 64, 64]
      enc_kernel_size: 3
      dec_kernel_size: 4
      stride: 2
      pad: 1
    obs_recon_mult: 100.0
    beta: 0.0001

device: cuda:1

training:
  total_steps: 2000
  batch_size: 128
  buffer_capacity: 2000
  buffer_sequence_length: null
  start_training_after: 500
  updates_per_step: 1
  seed: 0

evaluation:
  eval_every_episodes: 20
  num_episodes: 1
  record_video: true
  video_every_calls: 1

checkpoint:
  checkpoint_every_steps: 2000

logging:
  wandb_project: jared-rl
  wandb_entity: murphey-lab-nu
